services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-llama3.1}"]
    restart: "no"
  docuwriter:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - ./context:/app/context:ro
      - ./tocomplete:/app/tocomplete:ro
      - ./output:/app/output
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  ollama_models:
